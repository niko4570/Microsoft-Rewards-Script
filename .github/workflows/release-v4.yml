name: Publish v4 updates

on:
    push:
        branches: [v4]
        paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
    workflow_dispatch:

# Serialize planning and publication; never interrupt a release.
concurrency:
    group: publish-v4
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    plan:
        if: github.ref == 'refs/heads/v4'
        runs-on: ubuntu-latest
        outputs:
            desktop: ${{ steps.plan.outputs.desktop }}
            docker: ${{ steps.plan.outputs.docker }}
            desktop_tag: ${{ steps.plan.outputs.desktop_tag }}
            docker_tag: ${{ steps.plan.outputs.docker_tag }}
            docker_version: ${{ steps.plan.outputs.docker_version }}
            sha: ${{ steps.plan.outputs.sha }}
            manifest: release-plan-${{ github.run_attempt }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Read published stable releases (exclude pending drafts)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/published-tags.txt"
            - name: Plan component releases since their last tags
              id: plan
              env:
                  PUBLISHED_TAGS_FILE: ${{ runner.temp }}/published-tags.txt
              run: node scripts/release/plan.mjs --output "${{ runner.temp }}/release-plan.json"
            - name: Share immutable build version plan
              if: steps.plan.outputs.desktop == 'true' || steps.plan.outputs.docker == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: release-plan-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/release-plan.json
                  if-no-files-found: error
                  retention-days: 30

    checks:
        needs: plan
        if: needs.plan.outputs.desktop == 'true' || needs.plan.outputs.docker == 'true'
        uses: ./.github/workflows/ci.yml
        with:
            ref: ${{ needs.plan.outputs.sha }}
            release-plan: ${{ needs.plan.outputs.manifest }}

    desktop:
        needs: [plan, checks]
        if: needs.plan.outputs.desktop == 'true'
        permissions:
            contents: write
        uses: ./.github/workflows/desktop-windows.yml
        with:
            ref: ${{ needs.plan.outputs.sha }}
            release-plan: ${{ needs.plan.outputs.manifest }}
            release-tag: ${{ needs.plan.outputs.desktop_tag }}

    docker:
        needs: [plan, checks]
        if: needs.plan.outputs.docker == 'true'
        permissions:
            contents: write
            packages: write
        uses: ./.github/workflows/docker-publish.yml
        with:
            ref: ${{ needs.plan.outputs.sha }}
            release-plan: ${{ needs.plan.outputs.manifest }}
            tag: ${{ needs.plan.outputs.docker_tag }}
            version: ${{ needs.plan.outputs.docker_version }}
