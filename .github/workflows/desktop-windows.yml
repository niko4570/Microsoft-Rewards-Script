name: Windows desktop test package

on:
    workflow_dispatch:
    push:
        tags: ['desktop-v*']
    pull_request:
        paths: ['desktop/**', 'scripts/**', 'src/**', 'package*.json', '.github/workflows/desktop-windows.yml']

permissions:
    contents: read

jobs:
    package:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      desktop/package-lock.json
            - name: Verify desktop release tag
              if: startsWith(github.ref, 'refs/tags/desktop-v')
              shell: pwsh
              run: |
                  $version = node -p "require('./desktop/package.json').version"
                  if ($env:GITHUB_REF_NAME -ne "desktop-v$version") { throw "Desktop tag must match desktop/package.json version" }
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: desktop/src-tauri
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm run test:tasks
            - run: npm run test:log-parser
            # The Docker shell-runner integration is Linux-only; pure schedule
            # cases and the desktop scheduler run on Windows.
            - run: npm run test:schedule
            - run: npm ci --prefix desktop
            - run: npm test --prefix desktop
            - run: npm run build --prefix desktop
            - run: npm run test:native --prefix desktop
            - run: npm run package:win --prefix desktop
            - name: Verify installed app without development tools on PATH
              shell: pwsh
              run: ./desktop/build/installed-smoke.ps1
            - name: Upload installed UI evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: rewards-desktop-installed-smoke
                  path: desktop/release/installed-smoke.png
                  if-no-files-found: ignore
            - name: Corresponding source snapshot
              run: git archive --format=zip --output=desktop/release/rewards-desktop-source.zip HEAD
            - name: Include source checksum
              run: node desktop/build/checksums.mjs
            - uses: actions/upload-artifact@v4
              with:
                  name: rewards-desktop-windows-x64
                  path: |
                      desktop/release/*.exe
                      desktop/release/*.zip
                      desktop/release/SHA256SUMS.txt
                      docs/windows-desktop.md
                  retention-days: 30

    publish:
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        needs: package
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: rewards-desktop-windows-x64
                  path: release
            - name: Publish desktop release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Rewards Desktop ${{ github.ref_name }}
                  body_path: desktop/RELEASE_NOTES.md
                  make_latest: true
                  fail_on_unmatched_files: true
                  files: |
                      release/**/*.exe
                      release/**/*.zip
                      release/**/SHA256SUMS.txt
