name: Windows desktop test package

on:
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                type: string
                default: ''
            release-plan:
                type: string
                default: ''
            release-tag:
                type: string
                default: ''
    push:
        tags: ['desktop-v*']
    pull_request:
        paths: ['desktop/**', 'scripts/**', 'src/**', 'package*.json', '.github/workflows/desktop-windows.yml']

permissions:
    contents: read

jobs:
    package:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      desktop/package-lock.json
            - name: Download build version plan
              if: inputs.release-plan != ''
              uses: actions/download-artifact@v4
              with:
                  name: ${{ inputs.release-plan }}
                  path: ${{ runner.temp }}/release-plan
            - name: Apply build-only versions
              if: inputs.release-plan != ''
              run: node scripts/release/versions.mjs "${{ runner.temp }}/release-plan/release-plan.json"
            - name: Verify desktop release tag
              if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release-tag != ''
              shell: pwsh
              env:
                  RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
              run: |
                  $version = node -p "require('./desktop/package.json').version"
                  if ($env:RELEASE_TAG -ne "desktop-v$version") { throw "Desktop tag must match desktop/package.json version" }
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: desktop/src-tauri
                  cache-on-failure: true
            - name: Ensure shared WebView2 Runtime
              shell: pwsh
              run: ./desktop/build/ensure-webview2.ps1
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm run test:tasks
            - run: npm run test:log-parser
            # The Docker shell-runner integration is Linux-only; pure schedule
            # cases and the desktop scheduler run on Windows.
            - run: npm run test:schedule
            - run: npm ci --prefix desktop
            - run: npm test --prefix desktop
            - run: npm run build --prefix desktop
            - run: npm run test:native --prefix desktop
            - run: npm run package:win --prefix desktop
              env:
                  MRS_SMOKE_SCREENSHOT: ${{ github.workspace }}/desktop/release/packaged-smoke.png
            - name: Verify installed app without development tools on PATH
              shell: pwsh
              run: ./desktop/build/installed-smoke.ps1
            - name: Upload installed UI evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: rewards-desktop-installed-smoke
                  path: desktop/release/installed-smoke.png
                  if-no-files-found: ignore
            - name: Upload failed package evidence
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: rewards-desktop-failed-package
                  path: |
                      desktop/release/*.exe
                      desktop/release/*.zip
                      desktop/release/*.png
                      desktop/release/ui-smoke-failure.txt
                      desktop/release/portable/Rewards Desktop.exe
                  if-no-files-found: ignore
                  retention-days: 3
            - name: Corresponding source snapshot
              run: node scripts/release/source-archive.mjs desktop/release/rewards-desktop-source.zip
            - name: Include source checksum
              run: node desktop/build/checksums.mjs
            - uses: actions/upload-artifact@v4
              with:
                  name: rewards-desktop-windows-x64
                  path: |
                      desktop/release/*.exe
                      desktop/release/*.zip
                      desktop/release/SHA256SUMS.txt
                      docs/windows-desktop.md
                  retention-days: 30

    publish:
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release-tag != ''
        needs: package
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: actions/download-artifact@v4
              with:
                  name: rewards-desktop-windows-x64
                  path: release
            - name: Refuse to publish superseded automatic builds
              if: inputs.release-tag != ''
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git ls-remote origin refs/heads/v4 | cut -f1)" = "$(git rev-parse HEAD)"
            - name: Upload complete desktop draft
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.release-tag || github.ref_name }}
                  name: Rewards Desktop ${{ inputs.release-tag || github.ref_name }}
                  target_commitish: ${{ inputs.ref || github.sha }}
                  generate_release_notes: true
                  body_path: desktop/RELEASE_NOTES.md
                  draft: true
                  make_latest: false
                  fail_on_unmatched_files: true
                  files: |
                      release/**/*.exe
                      release/**/*.zip
                      release/**/SHA256SUMS.txt
            - name: Publish complete desktop release as latest
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
                  AUTOMATIC_REF: ${{ inputs.ref }}
              run: |
                  set -euo pipefail
                  if [ -n "$AUTOMATIC_REF" ]; then
                    test "$(git ls-remote origin refs/heads/v4 | cut -f1)" = "$(git rev-parse HEAD)"
                  fi
                  gh release edit "$RELEASE_TAG" --draft=false --latest
