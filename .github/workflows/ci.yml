name: CI

on:
    pull_request:
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                type: string
                default: ''
            release-plan:
                type: string
                default: ''

permissions:
    contents: read

concurrency:
    group: ci-${{ inputs.ref != '' && 'release' || 'standalone' }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ inputs.ref == '' }}

jobs:
    checks:
        name: Checks (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}
                  fetch-depth: 0
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      desktop/package-lock.json
            - name: Download build version plan
              if: inputs.release-plan != ''
              uses: actions/download-artifact@v4
              with:
                  name: ${{ inputs.release-plan }}
                  path: ${{ runner.temp }}/release-plan
            - name: Apply build-only versions
              if: inputs.release-plan != ''
              run: node scripts/release/versions.mjs "${{ runner.temp }}/release-plan/release-plan.json"
            - name: Install backend dependencies
              run: npm ci
            - name: Check formatting of pull request changes
              if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
              shell: bash
              env:
                  FORMAT_BASE: ${{ github.event.pull_request.base.sha }}
              run: |
                  set -euo pipefail
                  git diff --name-only --diff-filter=ACMR -z "$FORMAT_BASE" HEAD | xargs -0 -r npx prettier --check --ignore-unknown --
            - name: Install desktop dependencies
              run: npm ci --prefix desktop
            - name: Test release planning
              run: node --test scripts/release/*.test.mjs
            - name: Check code quality
              run: npm run lint
            - name: Build backend and test tasks, dashboard and OAuth
              run: npm run test:tasks
            - name: Build desktop
              run: npm run build --prefix desktop
            - name: Test log parser
              run: npm run test:log-parser
            - name: Test scheduling
              run: npm run test:schedule
            - name: Test desktop services and updater
              run: npm run desktop:test
