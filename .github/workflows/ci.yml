name: CI

on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Checks (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        env:
            # Unit/integration tests mock browser launches; UI checks run separately.
            ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      desktop/package-lock.json
            - name: Install backend dependencies
              run: npm ci
            - name: Install desktop dependencies
              run: npm ci --prefix desktop
            - name: Check code quality
              run: npm run lint
            - name: Build backend and test tasks, dashboard and OAuth
              run: npm run test:tasks
            - name: Build desktop
              run: npm run build --prefix desktop
            - name: Test log parser
              run: npm run test:log-parser
            - name: Test scheduling
              run: npm run test:schedule
            - name: Test desktop services and updater
              run: npm run desktop:test
