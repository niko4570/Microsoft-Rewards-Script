name: CI

on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                type: string
                default: ''

permissions:
    contents: read

concurrency:
    group: ci-${{ inputs.ref != '' && 'release' || 'standalone' }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ inputs.ref == '' }}

jobs:
    checks:
        name: Checks (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      desktop/package-lock.json
            - name: Install backend dependencies
              run: npm ci
            - name: Install desktop dependencies
              run: npm ci --prefix desktop
            - name: Test release planning
              run: node --test scripts/release/*.test.mjs
            - name: Check code quality
              run: npm run lint
            - name: Build backend and test tasks, dashboard and OAuth
              run: npm run test:tasks
            - name: Build desktop
              run: npm run build --prefix desktop
            - name: Test log parser
              run: npm run test:log-parser
            - name: Test scheduling
              run: npm run test:schedule
            - name: Test desktop services and updater
              run: npm run desktop:test
