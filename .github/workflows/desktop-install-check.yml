name: Windows desktop installer acceptance

on:
    workflow_dispatch:
        inputs:
            artifact_run_id:
                description: Successful Windows package workflow run ID to verify
                required: true
                type: string

permissions:
    contents: read
    actions: read

jobs:
    install:
        runs-on: windows-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - uses: actions/download-artifact@v4
              with:
                  name: rewards-desktop-windows-x64
                  run-id: ${{ inputs.artifact_run_id }}
                  github-token: ${{ github.token }}
                  path: ${{ runner.temp }}/desktop-artifacts
            - name: Verify installer and installed application
              shell: pwsh
              run: |
                  $checksums = @(Get-ChildItem -Path "$env:RUNNER_TEMP/desktop-artifacts" -Filter SHA256SUMS.txt -Recurse)
                  if ($checksums.Count -ne 1) { throw 'Expected one release checksum file.' }
                  ./desktop/build/installed-smoke.ps1 -ReleaseDirectory $checksums[0].DirectoryName
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: rewards-desktop-installed-smoke
                  path: desktop/release/installed-smoke.png
                  if-no-files-found: ignore
